services:
  postgres:
    image: postgres:16-alpine
    container_name: notification_postgres
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notification_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notification_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  init_db:
    build: .
    container_name: notification_init_db
    command: python -m app.core.init_db
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: notification_api
    command: python -m app.main
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      init_db:
        condition: service_completed_successfully
    restart: always

  bot:
    build: .
    container_name: notification_bot
    command: python -m app.bot.main
    env_file:
      - .env
    depends_on:
      init_db:
        condition: service_completed_successfully
    restart: always

  worker:
    build: .
    container_name: notification_worker
    command: python -m app.worker.main
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      init_db:
        condition: service_completed_successfully
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: notification_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - worker

  grafana:
    image: grafana/grafana:latest
    container_name: notification_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data: